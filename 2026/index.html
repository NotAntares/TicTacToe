<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
        <div class="players" >
            <h2>Player 1: <span id="player1-name">Schmojo</span> (<span id="player1-mark">X</span>)</h2>
            <h2>Player 2: <span id="player2-name">JoSchmo</span> (<span id="player2-mark">O</span>)</h2>
        </div>
        <h2>Score:</h2>
        <div class="score">
        </div>
    </header>
    <main>
        <div id="gameboard">

        </div>
    </main>
    <footer>
        <h1 class="win"></h1>
        <button id="reset-button">Reset</button>
        <button id="new-round">Next Round</button>
    </footer>
</body>
<script src="javascript.js"></script>
</html>
